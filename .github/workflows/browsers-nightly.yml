name: Browsers and leaks (nightly)

# Backlog S2.5 and S2.6. PR and main CI (ci.yml) run every Playwright suite on Chromium with
# software GL only, and the leak test with 10 rounds per chart family. This workflow adds, once a
# night and without touching the PR jobs:
#
# - the interaction and bundle suites on Playwright's Firefox and WebKit builds
#   (HOLOCHART_BROWSER, tests/browsers.ts). Neither suite compares pixels against baselines; the
#   visual suite stays Chromium-only. Tests that cannot run on a browser skip there with the
#   reason, and known product differences are `test.fixme` for that browser: both are listed in
#   docs/release/browser-support.md, so a red run here is a new difference.
# - the full leak test (tests/interaction/leak.spec.ts, 100 create/update/destroy rounds per chart
#   family) on all three browsers.
#
# WebKit here is Playwright's Linux build (WPE port), not Safari: it shares WebCore and ANGLE's
# shader translator with Safari but not the Metal backend or the system text stack, so real Safari
# still gets the manual pass in docs/release/browser-support.md before a release.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: browsers-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  interaction:
    name: interaction (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same pinned image as ci.yml: it ships the Firefox and WebKit builds of @playwright/test 1.63.0.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
      HOLOCHART_BROWSER: ${{ matrix.browser }}
      # The `leak` job below runs the full 100 rounds.
      LEAK_CYCLES: '10'
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Interaction tests (${{ matrix.browser }})
        run: pnpm test:interaction --shard ${{ matrix.shard }}/2
      - name: Interaction summary (failed and flaky tests)
        if: ${{ !cancelled() }}
        run: pnpm test:interaction:report
      - name: Upload interaction report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: interaction-report-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/interaction/
            playwright-report/interaction.json
            test-results/interaction/
          retention-days: 14
          if-no-files-found: ignore

  bundle:
    name: bundle smoke test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
      HOLOCHART_BROWSER: ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build and smoke-test the IIFE and ESM bundles (${{ matrix.browser }})
        run: pnpm test:bundle
      - name: Upload bundle test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-test-results-${{ matrix.browser }}
          path: test-results/bundle/
          retention-days: 14
          if-no-files-found: ignore

  leak:
    name: leak test (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
      HOLOCHART_BROWSER: ${{ matrix.browser }}
      LEAK_CYCLES: '100'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Leak test, 100 rounds per chart family (${{ matrix.browser }})
        run: pnpm test:interaction leak.spec.ts
      - name: Leak test summary
        if: ${{ !cancelled() }}
        run: pnpm test:interaction:report
      - name: Upload leak test report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: leak-report-${{ matrix.browser }}
          path: |
            playwright-report/interaction/
            playwright-report/interaction.json
            test-results/interaction/
          retention-days: 14
          if-no-files-found: ignore
