name: Release

# Release automation (plan E21.3, docs/release/releasing.md):
#
# 1. version: while `.changeset/*.md` files exist on main, keep a "Version Packages" PR up to date
#    (changesets/action runs `pnpm version-packages`: bumps versions, writes CHANGELOGs).
# 2. pack: once that PR is merged (no pending changesets), build the packages and pack every
#    version that isn't on npm yet. Unreleased 0.0.0 placeholders are never published.
# 3. publish: in the `npm` environment (required reviewers = manual approval), publish the packed
#    tarballs with npm provenance, push the git tags, and create a GitHub release.
#
# The publish job fails fast unless the NPM_TOKEN secret exists, and cannot start without the
# `npm` environment's approval. Maintainer setup: docs/release/releasing.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  version:
    name: version PR
    if: ${{ github.repository == 'holochart/holochart' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open / update the Version Packages PR
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create or update the Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore(release): version packages'
          commit: 'chore(release): version packages'
        env:
          # PRs opened with GITHUB_TOKEN don't trigger CI; an optional RELEASE_PR_TOKEN (fine-grained
          # PAT or GitHub App token with contents + pull-requests write) makes CI run on the PR.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

  pack:
    name: pack
    needs: version
    if: ${{ needs.version.outputs.hasChangesets == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.plan.outputs.count }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build and pack unpublished versions
        run: pnpm release:pack
      - name: Summarize the publish plan
        id: plan
        run: node .github/scripts/publish-plan.ts release-artifacts/publish-plan.json
      - name: Upload packed tarballs
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: pack
    if: ${{ needs.pack.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment with required reviewers; NPM_TOKEN is an environment secret.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mk7s/holochart
    permissions:
      contents: write # push git tags, create the GitHub release
      id-token: write # npm provenance (OIDC)
    steps:
      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set in the 'npm' environment; refusing to publish (docs/release/releasing.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish (with provenance) and tag
        env:
          # pnpm 11 reads pnpm_config_* (the NPM_ variant is for npm fallbacks). Provenance needs
          # `id-token: write` and a public repository.
          PNPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm release:publish
      - name: Push tags
        run: git push origin --tags
      - name: Create the GitHub release
        if: ${{ needs.pack.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          tag="@mk7s/holochart@${VERSION}"
          # Release notes: this version's section of the full bundle's changelog.
          awk -v v="$VERSION" '$0 == "## " v {found=1; next} found && /^## / {exit} found' \
            packages/holochart/CHANGELOG.md > release-notes.md || true
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --title "Holochart v${VERSION}" \
            --notes-file release-notes.md --verify-tag "${prerelease[@]}"
