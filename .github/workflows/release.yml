name: Release

# Release automation (plan E21.3, docs/release/releasing.md):
#
# 1. version: while `.changeset/*.md` files exist on main, keep a "Version Packages" PR up to date
#    (changesets/action runs `pnpm version-packages`: bumps versions, writes CHANGELOGs). In pre
#    mode (`.changeset/pre.json`) versions are prereleases (`0.1.0-alpha.N`) and consumed changesets
#    move to `.changeset/pre/`, which doesn't count as pending.
# 2. pack: once that PR is merged (no pending changesets), build the packages, pack every version
#    that isn't on npm yet, and run publint + arethetypeswrong on those tarballs. Unreleased 0.0.0
#    placeholders are never published.
# 3. publish: in the `npm` environment (required reviewers = manual approval), publish the packed
#    tarballs with npm provenance under the dist-tag `changeset pack` chose (the pre tag, e.g.
#    `alpha`, in pre mode), push the git tags, and create a GitHub release.
#
# npm auth: the NPM_TOKEN environment secret, or npm trusted publishing (OIDC) when the repository
# variable NPM_TRUSTED_PUBLISHING is `true`. Without either, the publish job fails fast. It cannot
# start without the `npm` environment's approval. Maintainer setup: docs/release/releasing.md.
#
# Nothing runs until releases are switched on: set the repository variable RELEASE_ENABLED to
# `true` (Settings → Secrets and variables → Actions → Variables). Opening the Version Packages PR
# also needs either "Allow GitHub Actions to create and approve pull requests" (Settings → Actions →
# General → Workflow permissions) or a RELEASE_PR_TOKEN secret. Until then the workflow is skipped
# instead of failing on every push; `pack` and `publish` follow `version` through `needs`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  version:
    name: version PR
    if: ${{ github.repository == 'holochart/holochart' && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the changeset-release/main branch
      pull-requests: write # open / update the Version Packages PR
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create or update the Version Packages PR
        id: changesets
        # v2 is the line for @changesets/cli v3 (v1 can't read the `.changeset/pre/` folder that
        # pre mode creates). In pre mode it appends the tag to the title: "… (alpha)".
        uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
          # PRs opened with GITHUB_TOKEN don't trigger CI; an optional RELEASE_PR_TOKEN (fine-grained
          # PAT or GitHub App token with contents + pull-requests write) makes CI run on the PR.
          # v2 reads the token from this input only (a different GITHUB_TOKEN env var is an error).
          github-token: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

  pack:
    name: pack
    needs: version
    if: ${{ needs.version.outputs.hasChangesets == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      count: ${{ steps.plan.outputs.count }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build and pack unpublished versions
        run: pnpm release:pack
      - name: Summarize the publish plan
        id: plan
        run: node .github/scripts/publish-plan.ts release-artifacts/publish-plan.json
      - name: publint and arethetypeswrong on the release tarballs
        if: ${{ steps.plan.outputs.count != '0' }}
        env:
          # tests/package/lint.ts checks these tarballs instead of packing afresh.
          HOLOCHART_PACKS: release-artifacts/packages
        run: node tests/package/lint.ts
      - name: Upload packed tarballs
        if: ${{ steps.plan.outputs.count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: pack
    if: ${{ needs.pack.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Protect this environment with required reviewers; NPM_TOKEN is an environment secret.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@mk7s/holochart
    permissions:
      contents: write # push git tags, create the GitHub release
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - name: Require npm credentials
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" != 'true' ] && [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is not set in the 'npm' environment and NPM_TRUSTED_PUBLISHING is not 'true'; refusing to publish (docs/release/releasing.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          # With trusted publishing, pnpm exchanges the job's OIDC token for a short-lived npm token.
          if [ "$TRUSTED" != 'true' ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publish (with provenance) and tag
        env:
          # pnpm 11 reads pnpm_config_* (the NPM_ variant is for npm fallbacks). Provenance needs
          # `id-token: write` and a public repository.
          PNPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm release:publish
      - name: Push tags
        run: git push origin --tags
      - name: Create the GitHub release
        if: ${{ needs.pack.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          tag="@mk7s/holochart@${VERSION}"
          # Release notes: this version's section of the full bundle's changelog.
          awk -v v="$VERSION" '$0 == "## " v {found=1; next} found && /^## / {exit} found' \
            packages/holochart/CHANGELOG.md > release-notes.md || true
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --title "Holochart v${VERSION}" \
            --notes-file release-notes.md --verify-tag "${prerelease[@]}"
