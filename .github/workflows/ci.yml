name: CI

on:
  # PR branches are covered by the pull_request trigger; pushing them too ran every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turborepo remote caching: active once TURBO_TOKEN (secret) and TURBO_TEAM (variable) are set.
  # Without them turbo falls back to its local cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: '1'
  # fast-check properties are seeded from the commit (plan E20.1, tests/property/setup.ts), so a
  # failure replays locally from the printed command; random seeds run nightly (property-nightly.yml).
  FC_SEED: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - name: Typecheck root configs and tests
        run: pnpm typecheck:tooling

  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build

  visual-tests:
    name: visual (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The expanded gallery exceeds one runner's 30-minute budget.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # Pinned image: the Chromium build and system libraries match @playwright/test 1.63.0, so
    # SwiftShader output is reproducible. Regenerate baselines in this same image (CONTRIBUTING.md).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Visual regression tests (Chromium + SwiftShader)
        run: pnpm test:visual --shard ${{ matrix.shard }}/2
      # Job summary: pixelmatch count (what the test gates on) next to the exact diff (pixels whose
      # RGBA differs at all, and the max channel delta), so drift inside tolerance is visible (E20.9).
      - name: Visual diff summary (pixelmatch vs exact)
        if: ${{ !cancelled() }}
        run: pnpm test:visual:report
      - name: Upload visual diff report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            tests/visual/__actual__/
            tests/visual/__diff__/
            test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

  # Preserve the branch-protection check name; both shards must pass.
  visual:
    name: visual
    needs: visual-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both visual shards to pass
        env:
          VISUAL_RESULT: ${{ needs.visual-tests.result }}
        run: test "$VISUAL_RESULT" = success

  # Docs pages render (backlog S1.5): every hand-written docs page loads in the VitePress dev server
  # with no console errors, failed requests or example embeds that error or never become ready.
  # Not a required check yet: it takes ~10-15 min on 2 workers.
  docs-render:
    name: docs pages render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Docs pages render without errors
        run: pnpm --filter @mk7s/holochart-docs check:render
      - name: Upload docs render report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-render-report
          path: test-results/docs-render/
          retention-days: 14
          if-no-files-found: ignore

  # Interaction tests (plan E20.4): scripted pointer, keyboard and touch scenarios (hover, zoom,
  # pan, lasso, clicks, GPU picking, legends, controls, a11y) against the dev sandbox, in the same
  # pinned image and software GL (Chromium + SwiftShader) as `visual`.
  #
  # Sharding: the ~190 tests add up to ~13 min of test time (4-6.5 min on 2 workers on a loaded
  # laptop); SwiftShader is CPU-bound and a 4-vCPU runner is slower per core, so the suite is split
  # in two jobs of 2 workers each (~4-7 min of tests per shard, plus image pull and install), well
  # inside the timeout, retries included.
  #
  # Retries: 1 here, 0 locally and in `visual` (tests/interaction/playwright.config.ts). A test that
  # fails and then passes on its retry is flaky: it does not fail the job (a slow software-GL frame
  # on a shared runner should not block a PR), but the job summary lists it with the error of its
  # failed attempt and its trace is uploaded, so flakes stay visible and get fixed. A test that
  # fails twice fails the job.
  interaction:
    name: interaction (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
      # Leak test (tests/interaction/leak.spec.ts): 10 create/update/destroy rounds per chart
      # family here; its counts are exact, so 10 find what 100 find. The nightly workflow
      # (browsers-nightly.yml) runs 100, where the heap-size check also applies.
      LEAK_CYCLES: '10'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Interaction tests (Chromium + SwiftShader)
        run: pnpm test:interaction --shard ${{ matrix.shard }}/2
      # Job summary: totals, failed tests and flaky tests (passed on the retry) with their errors.
      - name: Interaction summary (failed and flaky tests)
        id: summary
        if: ${{ !cancelled() }}
        run: pnpm test:interaction:report
      - name: Upload interaction report and traces
        if: ${{ !cancelled() && (failure() || steps.summary.outputs.flaky != '0') }}
        uses: actions/upload-artifact@v7
        with:
          name: interaction-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/interaction/
            playwright-report/interaction.json
            test-results/interaction/
          retention-days: 14
          if-no-files-found: ignore

  bundle:
    name: bundle smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Loads the IIFE CDN build in headless Chromium (SwiftShader) and checks window.Holochart.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build and smoke-test the IIFE bundle
        run: pnpm test:bundle

  # Package quality gates (backlog S1.3): what users download, not the workspace. Every publishable
  # package is packed once with `pnpm pack` (publishConfig applied, workspace:* resolved); publint
  # and arethetypeswrong check those tarballs (tests/package/lint.ts: pinned versions through
  # `pnpm dlx`, attw's esm-only profile), then the pack-and-install smoke test installs them into
  # fresh fixture projects outside the workspace (Node ESM/CJS, strict tsc with bundler and node16
  # resolution, a Vite app, a plain HTML page with the script-tag build) and draws a 2D and a 3D
  # chart in Chromium + SwiftShader (tests/package/playwright.config.ts).
  package:
    name: package checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
      # The fixtures install from the pnpm store; CI has the tarballs there (setup's frozen install)
      # but not the registry metadata, which pnpm fetches for what it lacks.
      PACKAGE_INSTALL_MODE: prefer-offline
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - name: Pack every publishable package
        run: |
          echo "HOLOCHART_PACKS=$RUNNER_TEMP/packs" >> "$GITHUB_ENV"
          node tests/package/packs.ts "$RUNNER_TEMP/packs"
      - name: publint and arethetypeswrong
        run: node tests/package/lint.ts
      - name: Pack-and-install smoke test
        if: ${{ !cancelled() }}
        run: pnpm exec playwright test -c tests/package/playwright.config.ts
      # API reports (backlog S2.13): the exports of every published package and their stability
      # tags are committed in api-reports/. This fails when a report differs from this build, so a
      # change to the public API is always in the PR's diff; `pnpm api:report` regenerates them.
      # It reads the declarations built above and takes about 10 s.
      - name: API reports are up to date
        if: ${{ !cancelled() }}
        run: node tools/api-report/src/cli.ts --check
      - name: Upload package test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: package-test-results
          path: test-results/package/
          retention-days: 14
          if-no-files-found: ignore

  # Three.js compatibility (ADR-003, docs/release/versioning.md): typecheck, unit tests and the
  # bundle smoke test (IIFE and ESM builds, which bundle the overridden three) against the lowest
  # supported three (the peer range's lower bound) and the newest release old enough for pnpm's
  # minimumReleaseAge (ADR-016). The catalog version is covered by the jobs above. The catalog is
  # overridden in the runner only; the repo's lockfile is not touched. Same pinned Playwright image
  # as `bundle`, for the browser.
  three:
    name: three (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `latest` is a canary for upcoming three releases: it never fails the workflow, but a failure
    # on main opens (or comments on) a tracking issue, so it doesn't pass silently.
    continue-on-error: ${{ matrix.leg == 'latest' }}
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    permissions:
      contents: read
      issues: write # the `latest` failure issue
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: min
            three: '0.180.0'
          - leg: latest
            three: '>=0.186.0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Override three and @types/three in the pnpm catalog
        id: three
        env:
          THREE: ${{ matrix.three }}
        run: |
          sed -i -E "s/^(  three:).*/\1 '${THREE}'/; s/^(  '@types\/three':).*/\1 '${THREE}'/" pnpm-workspace.yaml
          grep -E "^  (three|'@types/three'):" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          node -e "const fs=require('fs');for(const p of ['three','@types/three'])console.log(p,JSON.parse(fs.readFileSync('packages/render/node_modules/'+p+'/package.json','utf8')).version)"
          version=$(node -p "require('./packages/render/node_modules/three/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Bundle smoke test
        run: pnpm test:bundle
      # Pull requests only get the failed (non-blocking) check and this warning: a PR may be what
      # broke it, and fork PRs cannot write issues.
      - name: Warn that three (latest) fails
        if: ${{ failure() && matrix.leg == 'latest' }}
        env:
          VERSION: ${{ steps.three.outputs.version }}
        run: echo "::warning title=three (latest)::Fails with three ${VERSION:-(not installed)}; see this job's log."
      - name: Open or update the three (latest) issue
        if: ${{ failure() && matrix.leg == 'latest' && github.event_name != 'pull_request' }}
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.three.outputs.version }}
        with:
          script: |
            const marker = '<!-- holochart-three-latest -->';
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const version = process.env.VERSION || '(install failed)';
            const line = `three \`${version}\` fails the [three (latest) leg](${run}) on \`${context.sha.slice(0, 7)}\` (${context.eventName}).`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const open = issues.find((i) => !i.pull_request && i.body?.includes(marker));
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: line });
              core.notice(`Commented on #${open.number}`);
            } else {
              const body = [
                marker,
                line,
                '',
                'The `three (latest)` CI leg runs typecheck, unit tests and the bundle smoke test against',
                'the newest three release (ci.yml, job `three`). It does not block merges, so this issue',
                'tracks it: fix the incompatibility, then widen the `three` peer range',
                '(docs/release/versioning.md). Later failures comment here; close the issue once fixed.',
              ].join('\n');
              const { data } = await github.rest.issues.create({
                owner, repo, title: 'CI: three (latest) leg is failing', body,
              });
              core.notice(`Opened #${data.number}`);
            }

  # Bundle-size budgets (plan E21.1, docs/release/bundle-size.md). `pnpm size` builds the packages,
  # bundles each entry (min + gzip, three external; the IIFE as-is) and fails over budget. The
  # report compares with the latest successful `main` run, goes to the job summary, and is posted
  # as a PR comment (same-repo PRs only: fork PRs get a read-only token).
  size:
    name: bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # download main's size report
      pull-requests: write # PR comment
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download the size report of the latest main run (baseline)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "No successful main run yet; no baseline."; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name size-report --dir size-base
      - name: Check size budgets
        run: pnpm size
      - name: Size report
        if: ${{ !cancelled() }}
        run: |
          base=()
          if [ -f size-base/size.json ]; then base=(--base size-base/size.json); fi
          pnpm size:report --json size-report/size.json --markdown size-report/size.md "${base[@]}"
      - name: Upload size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: size-report
          path: size-report/
          retention-days: 30
          if-no-files-found: ignore
      - name: Comment on the PR
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const file = 'size-report/size.md';
            if (!fs.existsSync(file)) return;
            const body = fs.readFileSync(file, 'utf8');
            const marker = '<!-- holochart-size-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # TODO(E0.4, E16): benchmark report. Enable once apps/bench (tinybench + in-browser harness)
  # exists. Expected steps: run the harness headless under Playwright, upload results as an
  # artifact, and compare against the performance budgets.
  bench:
    name: benchmarks (TODO)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: echo "TODO — run apps/bench and upload its report" && exit 1

  # Docs site (plan E19.1, apps/docs, VitePress). Deployed from main by docs.yml.
  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm --filter @mk7s/holochart-docs lint:pages
      - run: pnpm --filter @mk7s/holochart-docs typecheck
      # Gallery thumbnails are committed (apps/docs/README.md#gallery); this checks, without a
      # browser, that they match examples/. Regenerate with `pnpm gallery` when it fails.
      - name: Gallery in sync with examples (E19.5)
        run: pnpm gallery:check
      - name: Committed notebook downloads match canonical sources
        run: python3 examples/notebooks/generate.py --check
      - name: Install Chromium for copied-source and production checks
        run: pnpm exec playwright install --with-deps chromium
      # A clean checkout has no ignored source ledger. Verify the cookbook exports and the
      # choropleth used by the language-filter regression before serializing their badges.
      - name: Generate and render complete cookbook source exports
        run: |
          pnpm --filter @mk7s/holochart-docs gen:sources
          node tools/gallery-gen/src/smoke-sources.ts layout/grid-coupled line/with-bars area/band recipes/ranked-bars line/gaps timeseries/date-formatting scatter/interactive axes/linked-axes themes/plotly_white layout/grid-independent choropleth/basic
      # VitePress fails the build on dead internal links (no ignoreDeadLinks in the config).
      - run: pnpm --filter @mk7s/holochart-docs build
      - name: Distributed sources and real-host evidence are current
        run: pnpm --filter @mk7s/holochart-docs check:site
      # After the build, so links to the generated reference pages are checked too. Hard gates:
      # attribute descriptions, >= 5 examples per released trace type, snippet type-check,
      # internal links; the rest is reported in the job summary (apps/docs/README.md).
      - name: Docs quality gates (E19.10)
        run: pnpm --filter @mk7s/holochart-docs quality
      - name: Production routes, sources, downloads and accessibility
        env:
          DOCS_RENDER_SERVER: preview
        run: pnpm --filter @mk7s/holochart-docs check:render foundation.spec.ts wave2.spec.ts wave3.spec.ts wave3-content.spec.ts wave4.spec.ts --workers=1 --retries=0
      - name: Upload production site failures
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-production-report
          path: test-results/docs-render/
          retention-days: 14
          if-no-files-found: ignore
