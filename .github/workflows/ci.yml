name: CI

on:
  # PR branches are covered by the pull_request trigger; pushing them too ran every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Turborepo remote caching: active once TURBO_TOKEN (secret) and TURBO_TEAM (variable) are set.
  # Without them turbo falls back to its local cache.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: '1'
  # fast-check properties are seeded from the commit (plan E20.1, tests/property/setup.ts), so a
  # failure replays locally from the printed command; random seeds run nightly (property-nightly.yml).
  FC_SEED: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - name: Typecheck root configs and tests
        run: pnpm typecheck:tooling

  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test:coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm build

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pinned image: the Chromium build and system libraries match @playwright/test 1.63.0, so
    # SwiftShader output is reproducible. Regenerate baselines in this same image (CONTRIBUTING.md).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Visual regression tests (Chromium + SwiftShader)
        run: pnpm test:visual
      # Job summary: pixelmatch count (what the test gates on) next to the exact diff (pixels whose
      # RGBA differs at all, and the max channel delta), so drift inside tolerance is visible (E20.9).
      - name: Visual diff summary (pixelmatch vs exact)
        if: ${{ !cancelled() }}
        run: pnpm test:visual:report
      - name: Upload visual diff report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report
          path: |
            playwright-report/
            tests/visual/__actual__/
            tests/visual/__diff__/
            test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

  bundle:
    name: bundle smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Loads the IIFE CDN build in headless Chromium (SwiftShader) and checks window.Holochart.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build and smoke-test the IIFE bundle
        run: pnpm test:bundle

  # Three.js compatibility (ADR-003, docs/release/versioning.md): typecheck and unit tests against
  # the lowest supported three (the peer range's lower bound) and the newest release old enough for
  # pnpm's minimumReleaseAge (ADR-016). The catalog version is covered by the jobs above. The
  # catalog is overridden in the runner only; the repo's lockfile is not touched.
  three:
    name: three (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `latest` is a canary for upcoming three releases: it reports but never fails the workflow.
    continue-on-error: ${{ matrix.leg == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: min
            three: '0.180.0'
          - leg: latest
            three: '>=0.186.0'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Override three and @types/three in the pnpm catalog
        env:
          THREE: ${{ matrix.three }}
        run: |
          sed -i -E "s/^(  three:).*/\1 '${THREE}'/; s/^(  '@types\/three':).*/\1 '${THREE}'/" pnpm-workspace.yaml
          grep -E "^  (three|'@types/three'):" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          node -e "const fs=require('fs');for(const p of ['three','@types/three'])console.log(p,JSON.parse(fs.readFileSync('packages/render/node_modules/'+p+'/package.json','utf8')).version)"
      - run: pnpm typecheck
      - run: pnpm test

  # Bundle-size budgets (plan E21.1, docs/release/bundle-size.md). `pnpm size` builds the packages,
  # bundles each entry (min + gzip, three external; the IIFE as-is) and fails over budget. The
  # report compares with the latest successful `main` run, goes to the job summary, and is posted
  # as a PR comment (same-repo PRs only: fork PRs get a read-only token).
  size:
    name: bundle size
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # download main's size report
      pull-requests: write # PR comment
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Download the size report of the latest main run (baseline)
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then echo "No successful main run yet; no baseline."; exit 0; fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name size-report --dir size-base
      - name: Check size budgets
        run: pnpm size
      - name: Size report
        if: ${{ !cancelled() }}
        run: |
          base=()
          if [ -f size-base/size.json ]; then base=(--base size-base/size.json); fi
          pnpm size:report --json size-report/size.json --markdown size-report/size.md "${base[@]}"
      - name: Upload size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: size-report
          path: size-report/
          retention-days: 30
          if-no-files-found: ignore
      - name: Comment on the PR
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const file = 'size-report/size.md';
            if (!fs.existsSync(file)) return;
            const body = fs.readFileSync(file, 'utf8');
            const marker = '<!-- holochart-size-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # TODO(E0.4, E16): benchmark report. Enable once apps/bench (tinybench + in-browser harness)
  # exists. Expected steps: run the harness headless under Playwright, upload results as an
  # artifact, and compare against the performance budgets.
  bench:
    name: benchmarks (TODO)
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: echo "TODO — run apps/bench and upload its report" && exit 1

  # Docs site (plan E19.1, apps/docs, VitePress). Deployed from main by docs.yml.
  docs:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build:packages
      - run: pnpm --filter @mk7s/holochart-docs lint:pages
      - run: pnpm --filter @mk7s/holochart-docs typecheck
      # Gallery thumbnails are committed (apps/docs/README.md#gallery); this checks, without a
      # browser, that they match examples/. Regenerate with `pnpm gallery` when it fails.
      - name: Gallery in sync with examples (E19.5)
        run: pnpm gallery:check
      # VitePress fails the build on dead internal links (no ignoreDeadLinks in the config).
      - run: pnpm --filter @mk7s/holochart-docs build
      # After the build, so links to the generated reference pages are checked too. Hard gates:
      # attribute descriptions, >= 5 examples per released trace type, snippet type-check,
      # internal links; the rest is reported in the job summary (apps/docs/README.md).
      - name: Docs quality gates (E19.10)
        run: pnpm --filter @mk7s/holochart-docs quality
