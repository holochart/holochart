name: Docs

# Builds the docs site (apps/docs, VitePress, base '/holochart/') and deploys it to the Cloudflare
# Pages project `holochart-docs` on every push to main. Files are deployed under a `holochart/`
# folder, so https://holochart-docs.pages.dev/holochart/… mirrors the final URLs, and a
# path-preserving proxy (deploy/cloudflare/) serves them at https://mk7s.dev/holochart/.
# Maintainer setup (secrets, `docs` environment, Pages project, proxy route):
# docs/release/docs-hosting.md. Without the secrets the deploy steps are skipped with a notice.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: deploy docs
    if: ${{ github.repository == 'holochart/holochart' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: docs
      url: https://mk7s.dev/holochart/
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set for the 'docs' environment; skipping the docs deploy (docs/release/docs-hosting.md)."
          fi

      - if: ${{ steps.creds.outputs.ok == 'true' }}
        uses: actions/checkout@v4
      - if: ${{ steps.creds.outputs.ok == 'true' }}
        uses: ./.github/actions/setup
      - name: Build the docs site
        if: ${{ steps.creds.outputs.ok == 'true' }}
        run: |
          pnpm build:packages
          pnpm --filter @mk7s/holochart-docs build

      # Pages serves the deploy root at /, so the site goes in a holochart/ folder to match
      # VitePress' base. `/` redirects to the docs, and the pages.dev mirror is not indexed
      # (the proxy strips X-Robots-Tag on mk7s.dev).
      - name: Stage the site under holochart/
        if: ${{ steps.creds.outputs.ok == 'true' }}
        run: |
          rm -rf .pages-deploy && mkdir -p .pages-deploy
          cp -R apps/docs/.vitepress/dist .pages-deploy/holochart
          printf '/ /holochart/ 302\n' > .pages-deploy/_redirects
          printf 'https://:project.pages.dev/*\n  X-Robots-Tag: noindex\n' > .pages-deploy/_headers
          mkdir -p .wrangler-tool

      # wrangler is installed with npm into an empty working directory, so it doesn't touch the
      # pnpm workspace or land in the deployed files.
      - name: Deploy to Cloudflare Pages
        if: ${{ steps.creds.outputs.ok == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: .wrangler-tool
          command: >-
            pages deploy ../.pages-deploy
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'holochart-docs' }}
            --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
