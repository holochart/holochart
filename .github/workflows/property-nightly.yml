name: Property tests (nightly)

# Plan E20.1: PR and main CI seed every fast-check property from the commit (FC_SEED in ci.yml),
# so those runs are reproducible but always explore the same cases. This workflow explores new
# ones: every property-test file, with a fresh random seed per test and per repetition, many times
# over. A failing property prints its seed, counterexample path and the command that replays it
# (tests/property/setup.ts, CONTRIBUTING.md "Property tests").

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      repeats:
        description: Extra repetitions of every property test (each with a new random seed).
        required: false
        default: '24'

concurrency:
  group: property-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  properties:
    name: properties (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Property tests with random seeds
        env:
          # FC_SEED stays unset: each test (and each repetition) draws its own seed.
          REPEATS: ${{ inputs.repeats || '24' }}
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(git grep -l "from 'fast-check'" -- '*.test.ts')
          echo "${#files[@]} property-test files, $((REPEATS + 1)) runs of each test, shard ${SHARD}/4"
          pnpm exec vitest run "${files[@]}" --repeats "$REPEATS" --shard "${SHARD}/4"
